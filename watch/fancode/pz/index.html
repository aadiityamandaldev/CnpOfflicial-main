function friendlyMessage(value){
  var raw=String(value||'');
  if(/timeout/i.test(raw)) return 'Connection timed out. Please check your internet and try again.';
  if(/network/i.test(raw)) return 'Network problem. Please check your internet connection.';
  if(/json parse/i.test(raw)) return 'Match data could not be read. Please try again shortly.';
  if(/http\s*4\d\d/i.test(raw)) return 'This stream is currently unavailable.';
  if(/http\s*5\d\d/i.test(raw)) return 'The streaming server is temporarily unavailable.';
  if(/shaka|hls|unsupported/i.test(raw)) return 'This stream could not be played in this browser right now.';
  return raw||'The stream could not be started.';
}

function seekPercent(event){
  var rect=prog.getBoundingClientRect();
  var point=event.touches?event.touches[0]:event;
  return Math.max(0,Math.min(1,(point.clientX-rect.left)/rect.width));
}

function applySeek(fraction){

  vid.currentTime=fraction*vid.duration;

function openQualitySelect(){
  if(qCooldown) return;
  var available=Q_ORDER.filter(function(quality){return qStreams[quality];});
  if(!available.length) return;
  closeQualitySelect();
  var rect=bq.getBoundingClientRect();
  var select=document.createElement('select');
  select.style.cssText='position:fixed;opacity:0.01;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:'+rect.height+'px;z-index:10000;font-size:16px;background:transparent;border:none;outline:none;-webkit-appearance:none;';
  available.forEach(function(quality){
    var option=document.createElement('option');
    option.value=quality;
    option.textContent=quality+(quality===currentQ?' ✓':'');
    option.selected=quality===currentQ;
    select.appendChild(option);
  });
  var done=false;
  function cleanup(){
    if(done) return;
    done=true;
    if(activeQualitySelect===select) activeQualitySelect=null;
    if(select.parentNode) select.parentNode.removeChild(select);
    qCooldown=true;
    setTimeout(function(){qCooldown=false;},350);
  }
  select.addEventListener('change',function(){
    var quality=select.value;
    cleanup();
    if(quality&&quality!==currentQ) switchQ(quality);
  });
  select.addEventListener('blur',function(){setTimeout(cleanup,250);});
  document.body.appendChild(select);
  activeQualitySelect=select;
  select.focus();
  try{if(select.showPicker) select.showPicker();else select.click();}catch(error){select.click();}
}

function loadScript(url){
  return new Promise(function(resolve,reject){
    var script=document.createElement('script');
    script.src=url;
    script.async=true;
    script.onload=resolve;
    script.onerror=function(){reject(new Error('Failed to load '+url));};
    document.head.appendChild(script);
  });
}

function getShaka(){return window.shaka&&window.shaka.Player?window.shaka:null;}

function ensureShaka(){
  var api=getShaka();
  if(api) return Promise.resolve(api);
  if(shakaPromise) return shakaPromise;
  shakaPromise=new Promise(function(resolve,reject){
    var index=0;
    function next(){
      if(index>=SHAKA_SOURCES.length){reject(new Error('Shaka Player could not be loaded'));return;}
      loadScript(SHAKA_SOURCES[index++]).then(resolve).catch(next);
    }
    next();
  }).then(function(){
    var loaded=getShaka();
    if(!loaded) throw new Error('Shaka Player did not initialize');
    if(loaded.polyfill&&loaded.polyfill.installAll) loaded.polyfill.installAll();
    if(!loaded.Player.isBrowserSupported()) throw new Error('Shaka Player is not supported by this browser');
    return loaded;
  }).catch(function(error){shakaPromise=null;throw error;});
  return shakaPromise;
}

function ensureHls(){
  if(window.Hls&&window.Hls.isSupported()) return Promise.resolve(window.Hls);
  return loadScript(HLS_JS).then(function(){
    if(!window.Hls||!window.Hls.isSupported()) throw new Error('HLS playback is not supported by this browser');
    return window.Hls;
  });
}

function currentRequest(token){return token===streamToken;}

function uniqueUrls(values){
  var seen={};
  return values.filter(function(value){
    if(!value||typeof value!=='string'||seen[value]) return false;
    seen[value]=true;
    return true;
  });
}

function errorText(error){
  if(!error) return 'Unknown playback error';
  return error.message||error.code||String(error);
}

async function clearEngine(){
  activePlaybackToken=0;
  hlsFailure=null;
  shakaFailure=null;
  var oldHls=hlsInst;
  var oldShaka=shakaPlayer;
  hlsInst=null;
  shakaPlayer=null;
  if(oldHls){try{oldHls.destroy();}catch(error){}}
  if(oldShaka){try{await oldShaka.destroy();}catch(error){}}
  try{vid.pause();}catch(error){}
  try{vid.removeAttribute('src');vid.src='';vid.load();}catch(error){}
}

function reportRuntimeFailure(token,message){
  if(!currentRequest(token)||activePlaybackToken!==token||hasError) return;
  activePlaybackToken=0;
  showErr('Playback Error',message,true);
}

function waitForPlayback(token,timeout){
  return new Promise(function(resolve,reject){
    var done=false;
    var timer=null;
    var watcher=null;
    function finish(error){
      if(done) return;
      done=true;
      clearTimeout(timer);
      clearInterval(watcher);
      vid.removeEventListener('playing',onPlaying);
      vid.removeEventListener('error',onError);
      if(error) reject(error);else resolve();
    }
    function onPlaying(){finish();}
    function onError(){finish(new Error(vid.error&&vid.error.code?'Media error '+vid.error.code:'Media element error'));}
    vid.addEventListener('playing',onPlaying);
    vid.addEventListener('error',onError);
    watcher=setInterval(function(){
      if(!currentRequest(token)){finish(new Error('Playback request replaced'));return;}
      if(shakaFailure){finish(shakaFailure);return;}
      if(hlsFailure){finish(hlsFailure);}
    },150);
    timer=setTimeout(function(){finish(new Error('Timed out while starting the stream'));},timeout||15000);
    try{
      var promise=vid.play();
      if(promise&&typeof promise.catch==='function') promise.catch(function(error){finish(new Error(errorText(error)));});
    }catch(error){finish(new Error(errorText(error)));}
  });
}

async function tryShaka(url,token,api){
  var instance=new api.Player();
  var started=false;
  function onError(event){
    if(shakaPlayer!==instance||!currentRequest(token)) return;
    var detail=event&&event.detail?event.detail:event;
    var message='Shaka playback error'+(detail&&detail.code?' '+detail.code:'');
    shakaFailure=new Error(message);
    if(started) reportRuntimeFailure(token,message);
  }
  try{
    instance.addEventListener('error',onError);
    await instance.attach(vid);
    if(!currentRequest(token)) throw new Error('Playback request replaced');
    shakaPlayer=instance;
    instance.configure({manifest:{retryParameters:{maxAttempts:3,baseDelay:500,backoffFactor:2,fuzzFactor:.25,timeout:12000}},streaming:{bufferingGoal:8,rebufferingGoal:1.5,bufferBehind:20,safeSeekOffset:3,lowLatencyMode:false,retryParameters:{maxAttempts:3,baseDelay:500,backoffFactor:2,fuzzFactor:.25,timeout:15000}},abr:{enabled:true,defaultBandwidthEstimate:1500000}});
    var networking=instance.getNetworkingEngine();
    if(networking&&networking.registerRequestFilter) networking.registerRequestFilter(function(type,request){request.headers=request.headers||{};request.headers.Accept=request.headers.Accept||'*/*';});
    await instance.load(url);
    if(!currentRequest(token)) throw new Error('Playback request replaced');
    started=true;
  }catch(error){
    try{await instance.destroy();}catch(ignore){}
    if(shakaPlayer===instance) shakaPlayer=null;
    throw error;
  }
}

async function tryHls(url,token){
  var HlsClass=await ensureHls();
  return new Promise(function(resolve,reject){
    var settled=false;
    var timer=null;
    var instance;
    function complete(error){
      if(settled) return;
      settled=true;
      clearTimeout(timer);
      if(error) reject(error);else resolve();
    }
    try{
      instance=new HlsClass({enableWorker:true,lowLatencyMode:false,backBufferLength:20,maxBufferLength:30,maxMaxBufferLength:45,manifestLoadingTimeOut:15000,manifestLoadingMaxRetry:2,manifestLoadingRetryDelay:500,levelLoadingTimeOut:15000,levelLoadingMaxRetry:2,fragLoadingTimeOut:20000,fragLoadingMaxRetry:3,capLevelToPlayerSize:true,startLevel:-1});
    }catch(error){reject(error);return;}
    hlsInst=instance;
    hlsFailure=null;
    timer=setTimeout(function(){complete(new Error('Timed out while loading the HLS manifest'));},16000);
    instance.on(HlsClass.Events.MANIFEST_PARSED,function(){complete();});
    instance.on(HlsClass.Events.ERROR,function(event,data){
      if(!data||!data.fatal) return;
      var detail=data.details||data.type||'HLS playback error';
      hlsFailure=new Error(detail);
      if(!settled){complete(hlsFailure);return;}
      if(!currentRequest(token)||hlsInst!==instance) return;
      if(data.type===HlsClass.ErrorTypes.NETWORK_ERROR&&hlsRecoveryCount<2){
        hlsRecoveryCount++;
        hlsFailure=null;
        try{instance.startLoad(-1);}catch(error){reportRuntimeFailure(token,detail);}
      }else if(data.type===HlsClass.ErrorTypes.MEDIA_ERROR&&hlsRecoveryCount<2){
        hlsRecoveryCount++;
        hlsFailure=null;
        try{instance.recoverMediaError();}catch(error){reportRuntimeFailure(token,detail);}
      }else reportRuntimeFailure(token,detail);
    });
    try{instance.loadSource(url);instance.attachMedia(vid);}catch(error){complete(error);}
  });
}

async function tryNative(url,token){
  if(!vid.canPlayType('application/vnd.apple.mpegurl')&&!vid.canPlayType('video/mp4')) throw new Error('Native playback is not available');
  vid.src=url;
  vid.load();
  vid.muted=true;
  await waitForPlayback(token,15000);
}

function finalizePlayback(token){
  if(!currentRequest(token)) return false;
  activePlaybackToken=token;
  hasError=false;
  errOv.classList.remove('show');
  if(userUnmuted){try{vid.muted=false;}catch(error){}}
  syncVol();
  syncPlayIcon();
  hideOverlay();
  showCtrls();
  return true;
}

async function startPreparedVideo(token){
  vid.muted=true;
  await waitForPlayback(token,15000);
  return finalizePlayback(token);
}

async function loadStream(url,fallbacks,pxUrl){
  var token=++streamToken;
  hasError=false;
  hlsRecoveryCount=0;
  var candidates=uniqueUrls([url].concat(pxUrl?[pxUrl]:[],fallbacks||[]));
  var errors=[];
  if(!candidates.length){showErr('Playback Error','No stream URL is available',true);return;}
  try{await clearEngine();}catch(error){}
  if(!currentRequest(token)) return;
  var api=null;
  try{api=await ensureShaka();}catch(error){errors.push('Shaka unavailable: '+errorText(error));}
  if(api){
    for(var i=0;i<candidates.length;i++){
      if(!currentRequest(token)) return;
      try{await clearEngine();await tryShaka(candidates[i],token,api);await startPreparedVideo(token);return;}
      catch(error){errors.push('Shaka: '+errorText(error));try{await clearEngine();}catch(ignore){}}
    }
  }
  for(var j=0;j<candidates.length;j++){
    if(!currentRequest(token)) return;
    try{await clearEngine();await tryHls(candidates[j],token);await startPreparedVideo(token);return;}
    catch(error){errors.push('HLS.js: '+errorText(error));try{await clearEngine();}catch(ignore){}}
  }
  for(var k=0;k<candidates.length;k++){
    if(!currentRequest(token)) return;
    try{await clearEngine();await tryNative(candidates[k],token);finalizePlayback(token);return;}
    catch(error){errors.push('Native: '+errorText(error));try{await clearEngine();}catch(ignore){}}
  }
  if(currentRequest(token)) showErr('Playback Error',errors.length?errors[errors.length-1]:'No playable stream found',true);
}

function fetchJSON(url){
  return new Promise(function(resolve,reject){
    var request=new XMLHttpRequest();
    var separator=url.indexOf('?')===-1?'?':'&';
    request.open('GET',url+separator+'_='+Date.now(),true);
    request.timeout=15000;
    request.onreadystatechange=function(){
      if(request.readyState!==4) return;
      if(request.status>=200&&request.status<300){try{resolve(JSON.parse(request.responseText));}catch(error){reject(new Error('JSON parse error'));}}
      else reject(new Error('HTTP '+request.status));
    };
    request.onerror=function(){reject(new Error('Network error'));};
    request.ontimeout=function(){reject(new Error('Timeout'));};
    request.send();
  });
}

function findMatch(data){
  var list=Array.isArray(data)?data:(Array.isArray(data.matches)?data.matches:[]);
  if(!list.length) throw new Error('No matches in JSON');
  for(var i=0;i<list.length;i++) if(String(list[i].match_id)===String(matchId)) return list[i];
  throw new Error('Match "'+matchId+'" not found ('+list.length+' total)');
}

function pickLanguageKey(match){
  var streams=match.auto_streams||{};
  var keys=Object.keys(streams);
  if(!keys.length) return null;
  var wanted=LANG_MAP[langCode]||match.language||keys[0];
  for(var i=0;i<keys.length;i++) if(String(keys[i]).toUpperCase()===String(wanted).toUpperCase()) return keys[i];
  return keys[0];
}

function resolve(data){
  var match=findMatch(data);
  var streams=match.streams||{};
  var fallbacks=[streams.primary,streams.fancode_cdn,streams.fancode_lk_cdn,streams.fancode_bd_cdn,streams.fancode_np_cdn].filter(Boolean);
  if(si===0){
    var language=pickLanguageKey(match);
    if(!language) throw new Error('No live stream. The match may not have started yet.');
    var selected=match.auto_streams[language]||{};
    if(!selected.streams||!Object.keys(selected.streams).length) throw new Error('Stream URLs are empty for this match');
    return {type:'multi',streams:selected.streams,fallbacks:fallbacks,pxUrl:selected.sonu_px||''};
  }
  var regional=si===1?streams.fancode_lk_cdn:si===2?streams.fancode_np_cdn:si===3?streams.fancode_bd_cdn:null;
  if(!regional) throw new Error('Regional stream (s='+si+') is not available');
  return {type:'single',url:regional,fallbacks:fallbacks,pxUrl:''};
}

function switchQ(quality){
  if(!qStreams[quality]) return;
  currentQ=quality;
  qlbl.textContent=quality;
  showLoad();
  loadStream(qStreams[quality],[],currentPxUrl);
}

function start(){
  clearTimeout(retryTimer);
  showLoad();
  if(!matchId){showErr('Missing Match ID','URL: ?id=MATCHID_LANG&s=0',false);return;}
  ensureShaka().catch(function(){});
  fetchJSON(JSON_URL).then(function(data){
    var result;
    try{result=resolve(data);}catch(error){showErr('Stream Unavailable',error.message,true);retryTimer=setTimeout(start,8000);return;}
    if(result.type==='multi'){
      qStreams=result.streams;
      currentPxUrl=result.pxUrl;
      var url=result.streams[DEFAULT_Q]||result.streams['720p']||result.streams['480p']||result.streams['1080p']||result.streams['360p']||result.streams['240p'];
      if(!url){showErr('No Stream URL','All quality URLs are empty for this match',true);return;}
      currentQ=Q_ORDER.find(function(quality){return result.streams[quality]===url;})||DEFAULT_Q;
      qlbl.textContent=currentQ;
      bq.style.display='';
      loadStream(url,result.fallbacks,currentPxUrl);
    }else{
      bq.style.display='none';
      loadStream(result.url,result.fallbacks,'');
    }
  }).catch(function(error){showErr('Could Not Load Data',error.message,true);retryTimer=setTimeout(start,8000);});
}

vid.addEventListener('waiting',function(){bufspin.style.display='block';});
vid.addEventListener('playing',function(){bufspin.style.display='none';});
vid.addEventListener('canplay',function(){bufspin.style.display='none';});
vid.addEventListener('play',function(){syncBig();syncPlayIcon();showCtrls();});
vid.addEventListener('pause',function(){
  syncBig();
  syncPlayIcon();
  showCtrls();
  if(!vid.ended&&!uPaused) setTimeout(function(){if(vid.paused&&!vid.ended&&!uPaused) vid.play().catch(function(){});},800);
});
vid.addEventListener('timeupdate',function(){
  if(isDragging) return;
  var percent=vid.duration&&isFinite(vid.duration)?vid.currentTime/vid.duration*100:99.5;
  setP(percent);
});
vid.addEventListener('progress',function(){
  if(!vid.buffered.length||!isFinite(vid.duration)) return;
  pbuf.style.width=vid.buffered.end(vid.buffered.length-1)/vid.duration*100+'%';
});
vid.addEventListener('loadedmetadata',function(){
  isLive=!isFinite(vid.duration)||vid.duration>86400;
  if(!isLive) livepill.style.display='none';
});

bpbtn.addEventListener('click',function(event){event.stopPropagation();uPaused=false;vid.play().catch(function(){});});
player.addEventListener('click',function(event){
  if(event.target.closest('#crow')||event.target.closest('.bpbtn')) return;
  showCtrls();
});
player.addEventListener('mousemove',showCtrls);
player.addEventListener('touchstart',showCtrls,{passive:true});
bplay.addEventListener('click',function(event){event.stopPropagation();if(vid.paused){uPaused=false;vid.play().catch(function(){});}else{uPaused=true;vid.pause();}});
bvol.addEventListener('click',function(event){event.stopPropagation();vid.muted=!vid.muted;if(!vid.muted) userUnmuted=true;syncVol();});
livepill.addEventListener('click',function(){
  if(!isLive||!vid.seekable||!vid.seekable.length) return;
  vid.currentTime=vid.seekable.end(vid.seekable.length-1);
  uPaused=false;
  if(vid.paused) vid.play().catch(function(){});
});
setInterval(function(){
  if(!isLive||!vid.seekable||!vid.seekable.length) return;
  var edge=vid.seekable.end(vid.seekable.length-1);
  var behind=edge-vid.currentTime>12;
  livepill.style.cursor=behind?'pointer':'default';
  lpitext.textContent=behind?'GO LIVE':'LIVE';
  livepill.style.color=behind?'#ffb020':'#ff5a5a';
  livepill.style.borderColor=behind?'rgba(255,176,32,.32)':'rgba(255,69,69,.32)';
  livepill.style.background=behind?'rgba(255,176,32,.13)':'rgba(255,69,69,.13)';
  var dot=livepill.querySelector('.ldot');
  if(dot) dot.style.background=behind?'#ffb020':'#ff4545';
},2000);

prog.addEventListener('mousedown',function(event){isDragging=true;prog.classList.add('drag');applySeek(seekPercent(event));});
prog.addEventListener('touchstart',function(event){isDragging=true;prog.classList.add('drag');applySeek(seekPercent(event));},{passive:true});
document.addEventListener('mousemove',function(event){if(isDragging) applySeek(seekPercent(event));});
document.addEventListener('touchmove',function(event){if(isDragging){event.preventDefault();applySeek(seekPercent(event));}},{passive:false});
document.addEventListener('mouseup',function(){if(isDragging){isDragging=false;prog.classList.remove('drag');}});
document.addEventListener('touchend',function(){if(isDragging){isDragging=false;prog.classList.remove('drag');}});

bq.addEventListener('click',function(event){event.stopPropagation();event.preventDefault();openQualitySelect();});
bfill.addEventListener('click',function(event){event.stopPropagation();fillModeIdx=(fillModeIdx+1)%FILL_MODES.length;applyFillMode(fillModeIdx);});
if(!document.pictureInPictureEnabled) bpip.style.display='none';
bpip.addEventListener('click',function(event){event.stopPropagation();if(document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});else vid.requestPictureInPicture().catch(function(){});});
bfs.addEventListener('click',function(event){
  event.stopPropagation();
  var active=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  if(!active){
    var request=player.requestFullscreen||player.webkitRequestFullscreen||player.mozRequestFullScreen;
    if(request){
      var result=request.call(player);
      if(result&&typeof result.then==='function') result.then(function(){if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});}).catch(function(){if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();});
    }else if(vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
  }else{
    var exit=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen;
    if(exit) exit.call(document);
    if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock();
  }
});
function syncFs(){
  var active=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  fsico.innerHTML=active?'<path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/>':'<path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/>';
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(name){document.addEventListener(name,syncFs);});
document.getElementById('retryNow').addEventListener('click',start);

applyFillMode(0);
syncVol();
showCtrls();
start();
})();

</script>

</body>
</html>
