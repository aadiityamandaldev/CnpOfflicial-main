  return new Promise(function(res, rej){

    var separator = url.indexOf('?') === -1 ? '?' : '&';
    x.open('GET', url + separator + '_=' + Date.now(), true);
    x.timeout = 15000;
    x.onreadystatechange = function(){

      if (x.status >= 200 && x.status < 300) {

        catch(e){ rej(new Error('JSON parse error')); }
      } else { rej(new Error('HTTP ' + x.status)); }
    };
    x.onerror = function(){ rej(new Error('Network error')); };
    x.ontimeout = function(){ rej(new Error('Timeout')); };
    x.send();
  });
}

function findMatch(data){

  throw new Error('Match "' + matchId + '" not found (' + list.length + ' total)');

  var as = m.auto_streams || {};
  var keys = Object.keys(as);
  if (!keys.length) return null;
  var want = LANG_MAP[langCode] || m.language || keys[0];
  for (var i = 0; i < keys.length; i++) if (keys[i] === want) return keys[i];
  for (var j = 0; j < keys.length; j++) if (String(keys[j]).toUpperCase() === String(want).toUpperCase()) return keys[j];
  return keys[0];
}

}

function ensureShaka(){
  var api = getShakaApi();
  if (api) return Promise.resolve(api);
  if (shakaLibsPromise) return shakaLibsPromise;
  shakaLibsPromise = loadFirstAvailableScript([
    'https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js',
    'https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.2/shaka-player.compiled.js'
  ]).then(function(){
    var loadedApi = getShakaApi();
    if (!loadedApi) throw new Error('Shaka Player did not initialize');
    if (loadedApi.polyfill && loadedApi.polyfill.installAll) loadedApi.polyfill.installAll();
    if (!loadedApi.Player.isBrowserSupported()) throw new Error('Shaka Player is not supported by this browser');
    return loadedApi;
  }).catch(function(error){
    shakaLibsPromise = null;
    throw error;
  });
  return shakaLibsPromise;
}

function ensureHls(){
  if (window.Hls && Hls.isSupported()) return Promise.resolve(Hls);
  return loadScript(HLS_JS).then(function(){
    if (!window.Hls || !Hls.isSupported()) throw new Error('HLS.js is not supported by this browser');
    return Hls;
  });
}

function isCurrentStream(token){
  return token === streamGeneration;
}

function errorMessage(error){
  if (!error) return 'Unknown playback error';
  if (error.message) return error.message;
  if (error.code) return 'Playback error ' + error.code;
  return String(error);
}

function uniqueUrls(urls){
  var seen = {};
  return urls.filter(function(url){
    if (!url || typeof url !== 'string' || seen[url]) return false;
    seen[url] = true;
    return true;
  });
}

async function clearPlaybackEngine(){
  activePlaybackToken = 0;
  hlsFatalError = null;
  shakaFatalError = null;
  var oldHls = hlsInst;
  var oldShaka = shakaPlayer;
  hlsInst = null;
  shakaPlayer = null;
  if (oldHls) {
    try { oldHls.destroy(); } catch(e){}
  }
  if (oldShaka) {
    try { await oldShaka.destroy(); } catch(e){}
  }
  try { vid.pause(); } catch(e){}
  try {
    vid.removeAttribute('src');
    vid.src = '';
    vid.load();
  } catch(e){}
}

function reportRuntimeFailure(token, message){
  if (!isCurrentStream(token) || activePlaybackToken !== token || hasError) return;
  activePlaybackToken = 0;
  showErr('Playback Error', message, true);
}

function finalizePlayback(token){
  if (!isCurrentStream(token)) return false;
  activePlaybackToken = token;
  hasError = false;
  errOv.classList.remove('show');
  hideOverlay();
  if (userUnmuted) {
    try { vid.muted = false; } catch(e){}
  }
  syncVol();
  syncPlayIcon();
  showCtrls();
  return true;
}

function waitForPlayback(token, timeout){
  return new Promise(function(resolve, reject){
    var settled = false;
    var watcher = null;
    var timer = null;
    function finish(error){
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      clearInterval(watcher);
      vid.removeEventListener('playing', onPlaying);
      vid.removeEventListener('error', onError);
      if (error) reject(error); else resolve();
    }
    function onPlaying(){ finish(); }
    function onError(){
      var code = vid.error && vid.error.code ? 'Media error ' + vid.error.code : 'Media element error';
      finish(new Error(code));
    }
    vid.addEventListener('playing', onPlaying);
    vid.addEventListener('error', onError);
    watcher = setInterval(function(){
      if (!isCurrentStream(token)) { finish(new Error('Playback request replaced')); return; }
      if (hlsFatalError) { finish(hlsFatalError); return; }
      if (shakaFatalError) { finish(shakaFatalError); }
    }, 150);
    timer = setTimeout(function(){ finish(new Error('Timed out while starting the stream')); }, timeout || 15000);
    try {
      var playResult = vid.play();
      if (playResult && typeof playResult.catch === 'function') {
        playResult.catch(function(error){ finish(new Error(errorMessage(error))); });
      }
    } catch(error) {
      finish(new Error(errorMessage(error)));
    }
  });
}

async function tryShaka(url, token, api){
  var instance = new api.Player();
  var started = false;
  function onError(event){
    if (shakaPlayer !== instance || !isCurrentStream(token)) return;
    var detail = event && event.detail ? event.detail : event;
    var message = 'Shaka playback error' + (detail && detail.code ? ' ' + detail.code : '');
    shakaFatalError = new Error(message);
    if (started) reportRuntimeFailure(token, message);
  }
  try {
    instance.addEventListener('error', onError);
    await instance.attach(vid);
    if (!isCurrentStream(token)) throw new Error('Playback request replaced');
    shakaPlayer = instance;
    instance.configure({
      manifest: {
        retryParameters: {
          maxAttempts: 3,
          baseDelay: 500,
          backoffFactor: 2,
          fuzzFactor: 0.25,
          timeout: 12000
        }
      },
      streaming: {
        bufferingGoal: 8,
        rebufferingGoal: 1.5,
        bufferBehind: 20,
        safeSeekOffset: 3,
        lowLatencyMode: false,
        retryParameters: {
          maxAttempts: 3,
          baseDelay: 500,
          backoffFactor: 2,
          fuzzFactor: 0.25,
          timeout: 15000
        }
      },
      abr: {
        enabled: true,
        defaultBandwidthEstimate: 1500000
      }
    });
    var networking = instance.getNetworkingEngine();
    if (networking && networking.registerRequestFilter) {
      networking.registerRequestFilter(function(type, request){
        request.headers = request.headers || {};
        request.headers.Accept = request.headers.Accept || '*/*';
      });
    }
    await instance.load(url);
    if (!isCurrentStream(token)) throw new Error('Playback request replaced');
    shakaPlayer = instance;
    started = true;
    return true;
  } catch(error) {
    try { await instance.destroy(); } catch(e){}
    if (shakaPlayer === instance) shakaPlayer = null;
    throw error;
  }
}

async function tryHlsjsUrl(url, token){
  var HlsClass = await ensureHls();
  return new Promise(function(resolve, reject){
    var settled = false;
    var timer = null;
    var instance;
    function complete(error){
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (error) reject(error); else resolve(true);
    }
    try {
      instance = new HlsClass({
        enableWorker: true,
        lowLatencyMode: false,
        backBufferLength: 20,
        maxBufferLength: 30,
        maxMaxBufferLength: 45,
        manifestLoadingTimeOut: 15000,
        manifestLoadingMaxRetry: 2,
        manifestLoadingRetryDelay: 500,
        levelLoadingTimeOut: 15000,
        levelLoadingMaxRetry: 2,
        fragLoadingTimeOut: 20000,
        fragLoadingMaxRetry: 3,
        capLevelToPlayerSize: true,
        startLevel: -1
      });
    } catch(error) {
      reject(error);
      return;
    }
    hlsInst = instance;
    hlsFatalError = null;
    timer = setTimeout(function(){
      complete(new Error('Timed out while loading the HLS manifest'));
    }, 16000);
    instance.on(HlsClass.Events.MANIFEST_PARSED, function(){
      complete();
    });
    instance.on(HlsClass.Events.ERROR, function(event, data){
      if (!data || !data.fatal) return;
      var detail = data.details || data.type || 'HLS playback error';
      hlsFatalError = new Error(detail);
      if (!settled) {
        complete(hlsFatalError);
        return;
      }
      if (!isCurrentStream(token) || hlsInst !== instance) return;
      if (data.type === HlsClass.ErrorTypes.NETWORK_ERROR && hlsRecoveryCount < 2) {
        hlsRecoveryCount++;
        hlsFatalError = null;
        try { instance.startLoad(-1); } catch(e) { reportRuntimeFailure(token, detail); }
      } else if (data.type === HlsClass.ErrorTypes.MEDIA_ERROR && hlsRecoveryCount < 2) {
        hlsRecoveryCount++;
        hlsFatalError = null;
        try { instance.recoverMediaError(); } catch(e) { reportRuntimeFailure(token, detail); }
      } else {
        reportRuntimeFailure(token, detail);
      }
    });
    try {
      instance.loadSource(url);
      instance.attachMedia(vid);
    } catch(error) {
      complete(error);
    }
  });
}

async function tryNativeUrl(url, token){
  if (!vid.canPlayType('application/vnd.apple.mpegurl') && !vid.canPlayType('video/mp4')) {
    throw new Error('Native playback is not available');
  }
  vid.src = url;
  vid.load();
  await waitForPlayback(token, 15000);
  return true;
}

async function startPreparedVideo(token){
  vid.muted = true;
  await waitForPlayback(token, 15000);
  return finalizePlayback(token);
}

async function loadStream(url, fallbacks, pxUrl){
  var token = ++streamGeneration;
  activeSourceUrl = url || '';
  activeFallbackUrls = (fallbacks || []).slice();
  activePxSourceUrl = pxUrl || '';
  hlsRecoveryCount = 0;
  shakaRecoveryCount = 0;
  hasError = false;
  var candidates = uniqueUrls([url].concat(pxUrl ? [pxUrl] : [], fallbacks || []));
  var errors = [];
  if (!candidates.length) {
    showErr('Playback Error', 'No stream URL is available', true);
    return;
  }
  try { await clearPlaybackEngine(); } catch(e){}
  if (!isCurrentStream(token)) return;

  var api = null;
  try { api = await ensureShaka(); }
  catch(error) { errors.push('Shaka unavailable: ' + errorMessage(error)); }

  if (api) {
    for (var i = 0; i < candidates.length; i++) {
      if (!isCurrentStream(token)) return;
      try {
        await clearPlaybackEngine();
        await tryShaka(candidates[i], token, api);
        await startPreparedVideo(token);
        return;
      } catch(error) {
        errors.push('Shaka: ' + errorMessage(error));
        try { await clearPlaybackEngine(); } catch(e){}
      }
    }
  }

  for (var j = 0; j < candidates.length; j++) {
    if (!isCurrentStream(token)) return;
    try {
      await clearPlaybackEngine();
      await tryHlsjsUrl(candidates[j], token);
      await startPreparedVideo(token);
      return;
    } catch(error) {
      errors.push('HLS.js: ' + errorMessage(error));
      try { await clearPlaybackEngine(); } catch(e){}
    }
  }

  for (var k = 0; k < candidates.length; k++) {
    if (!isCurrentStream(token)) return;
    try {
      await clearPlaybackEngine();
      vid.muted = true;
      await tryNativeUrl(candidates[k], token);
      finalizePlayback(token);
      return;
    } catch(error) {
      errors.push('Native: ' + errorMessage(error));
      try { await clearPlaybackEngine(); } catch(e){}
    }
  }

  if (isCurrentStream(token)) {
    showErr('Playback Error', errors.length ? errors[errors.length - 1] : 'No playable stream found', true);
  }
}

function switchQ(q){
  if (!qStreams[q]) return;
  currentQ = q;
  qlbl.textContent = q;
  showLoad();
  loadStream(qStreams[q], [], currentPxUrl);
}

function setupPx(url){
  if (hlsInst) { try { hlsInst.destroy(); } catch(e){} hlsInst = null; }
  if (plyrInst) { try { plyrInst.destroy(); } catch(e){} plyrInst = null; }

  plyrWrap.innerHTML = '';
  plyrWrap.classList.add('on');

  pxVideo = document.createElement('video');
  pxVideo.id = 'pxVideo';
  pxVideo.setAttribute('playsinline', '');
  pxVideo.setAttribute('webkit-playsinline', '');
  pxVideo.setAttribute('crossorigin', 'anonymous');
  pxVideo.preload = 'auto';
  pxVideo.muted = true;
  plyrWrap.appendChild(pxVideo);

  plyrInst = new Plyr(pxVideo, {
    controls: ['play-large','play','progress','current-time','duration','mute','volume','settings','pip','airplay','fullscreen'],
    settings: ['speed'],
    speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
    keyboard: { focused: true, global: true },
    tooltips: { controls: true, seek: true },
    fullscreen: { enabled: true, fallback: true, iosNative: true },
    hideControls: true,
    resetOnEnd: false,
    invertTime: false,
    displayDuration: true,
    seekTime: 10,
    storage: { enabled: false }
  });

  pxVideo.addEventListener('playing', function(){
    hasError = false;
    errOv.classList.remove('show');
    hideOverlay();
  });

  pxVideo.addEventListener('volumechange', function(){
    if (!pxVideo.muted && pxVideo.volume > 0) pxUserUnmuted = true;
  });

  pxVideo.addEventListener('error', function(){
    if (!hlsInst) showErr('Playback Error', 'Stream unavailable', true);
  });

  pxRetries = 0;
  if (window.Hls && Hls.isSupported()) {
    hlsInst = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 15,
      maxBufferLength: 20,
      maxMaxBufferLength: 30,
      manifestLoadingTimeOut: 12000,
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 500,
      levelLoadingTimeOut: 12000,
      levelLoadingMaxRetry: 3,
      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 4,
      startLevel: -1,
      capLevelToPlayerSize: true
    });
    hlsInst.on(Hls.Events.MANIFEST_PARSED, function(){
      try { pxVideo.muted = !pxUserUnmuted; } catch(e){}
      try { pxVideo.play().catch(function(){}); } catch(e){}
    });
    hlsInst.on(Hls.Events.ERROR, function(evt, data){
      if (!data || !data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        if (pxRetries < 2) { pxRetries++; try { hlsInst.startLoad(); } catch(e){} }
        else showErr('Playback Error', 'Network error while loading stream', true);
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        if (pxRetries < 2) { pxRetries++; try { hlsInst.recoverMediaError(); } catch(e){} }
        else showErr('Playback Error', 'Media error while playing stream', true);
      } else {
        showErr('Playback Error', 'Stream error: ' + (data.details || ''), true);
      }
    });
    hlsInst.loadSource(url);
    hlsInst.attachMedia(pxVideo);
  } else if (pxVideo.canPlayType('application/vnd.apple.mpegurl')) {
    pxVideo.src = url;
    pxVideo.addEventListener('loadedmetadata', function(){
      try { pxVideo.muted = !pxUserUnmuted; } catch(e){}
      try { pxVideo.play().catch(function(){}); } catch(e){}
    }, {once:true});
  } else {
    showErr('Unsupported Browser', 'HLS playback is not supported on this browser', false);
  }
}

function startPx(){
  clearTimeout(retryTimer);
  hasError = false;
  showLoad();
  if (!matchId) { showErr('Missing match ID', 'URL: ?id=MATCHID_px', false); return; }
  Promise.all([loadPxLibs(), fetchJSON(JSON_URL)]).then(function(r){
    var m = findMatch(r[1]);
    if (!m.auto_streams || !Object.keys(m.auto_streams).length) throw new Error('No live stream — match not started yet');
    var url = getPxUrl(m);
    if (!url) throw new Error('sonu_px stream not available for this match');
    setupPx(url);
  }).catch(function(e){
    showErr('Stream Unavailable', (e && e.message) ? e.message : 'Something went wrong', true);
    retryTimer = setTimeout(startPx, 8000);
  });
}

function start(){
  clearTimeout(retryTimer);
  showLoad();
  if (!matchId) { showErr('Missing Match ID', 'URL: ?id=MATCHID_LANG&s=0', false); return; }
  ensureShaka().catch(function(){});
  fetchJSON(JSON_URL).then(function(data){
    var r;
    try { r = resolve(data); }
    catch(e){ showErr('Stream Unavailable', e.message, true); retryTimer = setTimeout(start, 8000); return; }
    if (r.type === 'multi') {
      qStreams = r.streams;
      currentPxUrl = r.pxUrl;
      var url = r.streams[DEFAULT_Q] || r.streams['720p'] || r.streams['480p'] || r.streams['1080p'] || r.streams['360p'] || r.streams['240p'];
      if (!url) { showErr('No Stream URL', 'All quality URLs empty for this match', true); return; }
      currentQ = Q_ORDER.find(function(q){ return r.streams[q] === url; }) || DEFAULT_Q;
      qlbl.textContent = currentQ;
      bq.style.display = '';
      loadStream(url, r.fallbacks, currentPxUrl);
    } else {
      bq.style.display = 'none';
      currentPxUrl = r.pxUrl;
      loadStream(r.url, r.fallbacks, currentPxUrl);
    }
  }).catch(function(e){
    showErr('Could Not Load Data', e.message, true);
    retryTimer = setTimeout(start, 8000);
  });
}

bq.addEventListener('click', function(e){
  e.stopPropagation();
  e.preventDefault();
  if (qCooldown) return;
  var avail = Q_ORDER.filter(function(q){ return qStreams[q]; });
  if (!avail.length) return;
  if (activeQualitySelect && activeQualitySelect.parentNode) activeQualitySelect.parentNode.removeChild(activeQualitySelect);

  var rect = bq.getBoundingClientRect();
  var sel = document.createElement('select');
  sel.style.cssText = 'position:fixed;opacity:0.01;left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;height:' + rect.height + 'px;z-index:10000;font-size:16px;background:transparent;border:none;outline:none;-webkit-appearance:none;';
  avail.forEach(function(q){
    var option = document.createElement('option');
    option.value = q;
    option.textContent = q + (q === currentQ ? ' ✓' : '');
    option.selected = q === currentQ;
    sel.appendChild(option);
  });
  var done = false;
  function cleanup(){
    if (done) return;
    done = true;
    if (activeQualitySelect === sel) activeQualitySelect = null;
    if (sel.parentNode) sel.parentNode.removeChild(sel);
    qCooldown = true;
    setTimeout(function(){ qCooldown = false; }, 350);
  }
  sel.addEventListener('change', function(){
    var quality = sel.value;
    cleanup();
    if (quality && quality !== currentQ) switchQ(quality);
  });
  sel.addEventListener('blur', function(){ setTimeout(cleanup, 250); });
  document.body.appendChild(sel);
  activeQualitySelect = sel;
  sel.focus();
  try {
    if (sel.showPicker) sel.showPicker();
    else sel.click();
  } catch(error) {
    sel.click();
  }
});

bfs.addEventListener('click', function(e){
  e.stopPropagation();
  var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  if (!inFs) {
    var req = player.requestFullscreen || player.webkitRequestFullscreen || player.mozRequestFullScreen;
    if (req) {
      var fsResult = req.call(player);
      if (fsResult && typeof fsResult.then === 'function') {
        fsResult.then(function(){
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
        }).catch(function(){
          if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
        });
      } else {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
      }
    } else if (vid.webkitEnterFullscreen) {
      vid.webkitEnterFullscreen();
    }
  } else {
    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
    if (ex) {
      var exResult = ex.call(document);
      if (exResult && typeof exResult.catch === 'function') exResult.catch(function(){});
    }
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }
});

['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){
  document.addEventListener(ev, syncFs);
});

document.getElementById('retryNow').addEventListener('click', function(){
  if (pxMode) startPx(); else start();
});

if (pxMode) {
  initPx();
} else {
  start();
}

})();
</script>
